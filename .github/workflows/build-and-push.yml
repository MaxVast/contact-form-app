name: build and push images
on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: set lower case IMAGE_NAMESPACE name
        run: |
          echo "IMAGE_NAMESPACE_LC=${IMAGE_NAMESPACE,,}" >>${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/contact-form-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/contact-form-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/contact-form-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/contact-form-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max