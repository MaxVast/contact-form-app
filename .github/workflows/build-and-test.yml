name: build and test
on:
  pull_request:
    branches:
      - develop
env:
  APP_ENV: test
  JWT_SECRET: "ci-test-secret-change-me"
  JWT_EXPIRATION: "1h"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install docker-compose
        run: |
          sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Install Task
        uses: arduino/setup-task@v1

      - name: Run App
        run: task install

      - name: Wait for service
        run: |
          container_id="$(docker-compose ps -q contact-backend)"

          if [ -z "$container_id" ]; then
            echo "❌ contact-backend container not found"
            echo "=== docker-compose ps ==="
            docker-compose ps
            echo "=== docker-compose ps -a ==="
            docker-compose ps -a
            echo "=== docker-compose logs ==="
            docker-compose logs contact-backend
            exit 1
          fi

          echo "Container: $container_id"

          for i in {1..60}; do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"

            echo "Backend status: $status"

            case "$status" in
              starting)
                sleep 2
                ;;
              healthy)
                exit 0
                ;;
              unhealthy)
                echo "❌ Backend is unhealthy"
                docker-compose ps
                docker-compose logs contact-backend
                exit 1
                ;;
              no-healthcheck)
                echo "❌ No healthcheck configured"
                docker-compose ps
                exit 1
                ;;
              *)
                sleep 2
                ;;
            esac
          done

          echo "❌ Timeout waiting for contact-backend"
          docker-compose ps
          docker-compose logs contact-backend
          exit 1

      - name: Check App
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ /health OK"
            exit 0
          fi

          echo "❌ /health returned $HTTP_CODE"
          docker-compose logs contact-backend
          exit 1

      - name: Check Database
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ready)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ /ready OK"
            exit 0
          fi

          echo "❌ /ready returned $HTTP_CODE"
          docker-compose logs contact-backend
          exit 1

      - name: Run Tests
        run: task ci

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/reports/backend-coverage.out
          retention-days: 1

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Stop containers
        if: always()
        run: docker-compose down -v