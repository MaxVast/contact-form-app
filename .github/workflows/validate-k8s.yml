name: validate k8s config

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint --strict ./k8s/contact-form-app

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate manifests with kubeconform
        run: |
          helm template contact-form-app ./k8s/contact-form-app | kubeconform -strict -summary

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy to kind (structural smoke test)
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_DB=test \
            --from-literal=POSTGRES_USER=test \
            --from-literal=POSTGRES_PASSWORD=test
          helm install contact-form ./k8s/contact-form-app \
            --set backend.image.repository=contact-backend \
            --set backend.image.tag=local \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=contact-frontend \
            --set frontend.image.tag=local \
            --set frontend.image.pullPolicy=Never

  minikube-integration-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build images inside minikube's docker env
        run: |
          minikube image build -t contact-backend:ci ./backend
          minikube image build -t contact-frontend:ci ./frontend

      - name: Check Minikube images
        run: |
          minikube image ls | grep contact

      - name: Deploy Postgres
        run: |
          kubectl create secret generic postgres-secret-form-app \
            --from-literal=POSTGRES_DB=contact_db \
            --from-literal=POSTGRES_USER=contact \
            --from-literal=POSTGRES_PASSWORD=contact
          kubectl -n contact-form create secret generic backend-form-app-secret --from-literal=DATABASE_URL="postgres://contact:contact@postgres:5432/contact_db?sslmode=disable"
          kubectl apply -f k8s/database/postgres.yaml
          kubectl apply -n contact-form -f k8s/postgres/statefulset.yaml -f k8s/postgres/service.yaml
          kubectl rollout status deployment/postgres --timeout=90s

      - name: Deploy application chart
        run: |
          eval $(minikube docker-env)
          helm upgrade --install contact-form ./k8s/contact-form-app \
            --set backend.image.repository=contact-backend \
            --set backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set backend.existingSecret=postgres-secret-form-app \
            --set frontend.image.repository=contact-frontend \
            --set frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never

      - name: Show deployed images
        run: |
          kubectl get deployment contact-backend \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          kubectl get deployment contact-frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Wait for pods to be ready
        run: |
          kubectl rollout status deployment/contact-backend --timeout=90s || {
            echo "❌ Backend deployment failed"
            kubectl get pods -l app=contact-backend -o wide
            kubectl describe pods -l app=contact-backend
            kubectl get events --sort-by=.lastTimestamp
            kubectl logs deployment/contact-backend --all-containers=true
            exit 1
          }

          kubectl rollout status deployment/contact-frontend --timeout=90s || {
            echo "❌ Frontend deployment failed"
            kubectl get pods -l app=contact-frontend -o wide
            kubectl describe pods -l app=contact-frontend
            kubectl get events --sort-by=.lastTimestamp
            kubectl logs deployment/contact-frontend --all-containers=true
            exit 1
          }

      - name: Check backend health
        run: |
          kubectl port-forward service/contact-backend 8080:8080 &
          PF_PID=$!

          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          sleep 3

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/health)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Backend health check OK"
            exit 0
          fi

          echo "Backend health check failed with HTTP $HTTP_CODE"

          kubectl get pods -l app=contact-backend -o wide
          kubectl logs deployment/contact-backend

          exit 1

      - name: Check backend readiness
        run: |
          kubectl port-forward service/contact-backend 8080:8080 &
          PF_PID=$!

          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          sleep 3

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/ready)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Backend readiness check OK"
            exit 0
          fi

          echo "Backend readiness check failed with HTTP $HTTP_CODE"

          kubectl get pods -l app=contact-backend -o wide
          kubectl logs deployment/contact-backend

          exit 1

      - name: Check frontend homepage
        run: |
          kubectl port-forward service/contact-frontend 8081:8080 &
          PF_PID=$!

          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          sleep 3

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8081/)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Frontend homepage check OK"
            exit 0
          fi

          echo "Frontend homepage check failed with HTTP $HTTP_CODE"

          kubectl get pods -l app=contact-frontend -o wide
          kubectl logs deployment/contact-frontend

          exit 1