name: validate k8s config

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint --strict ./k8s/contact-form-app

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate manifests with kubeconform
        run: |
          helm template contact-form-app ./k8s/contact-form-app | kubeconform -strict -summary

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy to kind (structural smoke test)
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_DB=test \
            --from-literal=POSTGRES_USER=test \
            --from-literal=POSTGRES_PASSWORD=test
          helm install contact-form ./k8s/contact-form-app \
            --set backend.image.repository=contact-backend \
            --set backend.image.tag=local \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=contact-frontend \
            --set frontend.image.tag=local \
            --set frontend.image.pullPolicy=Never

  minikube-integration-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build images inside minikube's docker env
        run: |
          eval $(minikube docker-env)
          docker build -t contact-backend:ci ./backend
          docker build -t contact-frontend:ci ./frontend

      - name: Deploy Postgres
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_DB=contact_db \
            --from-literal=POSTGRES_USER=contact \
            --from-literal=POSTGRES_PASSWORD=contact
          kubectl apply -f k8s/database/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=90s

      - name: Deploy application chart
        run: |
          eval $(minikube docker-env)
          helm install contact-form ./k8s/contact-form-app \
            --set backend.image.repository=contact-backend \
            --set backend.image.tag=local \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=contact-frontend \
            --set frontend.image.tag=local \
            --set frontend.image.pullPolicy=Never

      - name: Wait for pods to be ready
        run: |
          kubectl rollout status deployment/contact-backend --timeout=90s || {
            kubectl describe pod -l app=contact-backend
            kubectl logs -l app=contact-backend
            exit 1
          }

          kubectl rollout status deployment/contact-frontend --timeout=90s || {
            kubectl describe pod -l app=contact-frontend
            kubectl logs -l app=contact-frontend
            exit 1
          }