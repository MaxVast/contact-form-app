{{- if .Values.ingress.rateLimit.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contact-form-api-ingress
  labels:
    {{- include "contact-form-app.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.ingress.rateLimit.rps }}"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "{{ .Values.ingress.rateLimit.burstMultiplier }}"
    nginx.ingress.kubernetes.io/limit-req-status-code: "{{ .Values.ingress.rateLimit.limitReqStatusCode }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/contact
            pathType: Prefix
            backend:
              service:
                name: contact-backend
                port:
                  number: {{ .Values.backend.port }}
{{- end }}
