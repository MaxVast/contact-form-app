{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contact-backend
  labels:
    {{- include "contact-form-app.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitorLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: contact-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
