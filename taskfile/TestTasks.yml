version: '3'

tasks:
  test-backend:
    desc: "Tests Go avec couverture"
    dir: backend
    cmds:
      - mkdir -p ./reports
      - docker-compose up -d go
      - docker-compose exec go sh -c "go test ./... -v -coverprofile=reports/backend-coverage.out"

  test-frontend:
    desc: "Tests front (Vitest) avec couverture"
    dir: frontend
    cmds:
      - docker-compose up -d node
      - docker-compose exec node sh -c "npm ci"
      - docker-compose exec node sh -c "npm run test -- --coverage"