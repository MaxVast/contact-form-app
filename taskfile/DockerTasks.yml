version: '3'

tasks:
  build:
    desc: "Build et démarre les services"
    cmds:
      - docker-compose up -d --build

  up:
    desc: 'Run docker containers.'
    cmds:
      - docker-compose up -d --remove-orphans

  stop:
    desc: "Arrête les conteneurs"
    cmds:
      - docker-compose stop

  down:
    desc: "Arrête et supprime les conteneurs"
    cmds:
      - docker-compose down --remove-orphans

  clean:
    desc: "Supprime les conteneurs et les volumes"
    cmds:
      - docker-compose down -v --remove-orphans

  restart:
    desc: 'Relaunch docker containers.'
    cmds:
      - task: down
      - task: up
      - task: ps

  build:backend:
    desc: 'Run backend'
    cmds:
      - docker-compose up -d go
      - docker-compose exec go sh -c "go build ./..."

  build:frontend:
  desc: "Build frontend"
  cmds:
    - docker-compose up -d node
    - docker-compose exec node sh -c "npm run build"

  logs:
    desc: "Display container's logs."
    cmds:
      - docker-compose logs {{.CLI_ARGS}}

  ps:
    desc: 'Show docker processes.'
    cmds:
      - docker-compose ps

  go:
    desc: "Ouvre un shell dans le conteneur Go"
    cmds:
      - docker-compose up -d go
      - docker-compose exec go sh

  node:
    desc: "Ouvre un shell dans le conteneur Node"
    cmds:
      - docker-compose up -d node
      - docker-compose exec node sh

  stop:dev:
    desc: "Arrête les conteneurs Go et Node"
    cmds:
      - docker-compose stop go node

  down:dev:
    desc: "Arrête et supprime les conteneurs Go et Node"
    cmds:
      - docker-compose rm -sf go node