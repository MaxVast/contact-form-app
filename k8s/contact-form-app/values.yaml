backend:
  replicas: 2
  image:
    repository: ghcr.io/maxvast/contact-form-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8080
  corsOrigin: "http://contact.example.com"
  existingSecret: postgres-credentials
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  replicas: 2
  image:
    repository: ghcr.io/maxvast/contact-form-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: contact-form-app.com