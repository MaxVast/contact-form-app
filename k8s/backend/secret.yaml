# DATABASE_URL contient le mot de passe -> Secret, pas ConfigMap.
# À adapter si le mot de passe de postgres-secret change.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: contact-form
type: Opaque
stringData:
  DATABASE_URL: "postgres://contact:contact@postgres:5432/contact_db?sslmode=disable"
